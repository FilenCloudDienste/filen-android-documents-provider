pluginManagement {
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // rustls-platform-verifier's Kotlin half; the filen-mobile app adds the same repository.
        maven {
            url 'https://github.com/rustls/rustls-platform-verifier/raw/maven-archive/android-release-support/maven/'
            content {
                includeGroup 'org.rustls'
            }
        }
    }
}

rootProject.name = "FilenDocumentsProvider"
include ':app'
